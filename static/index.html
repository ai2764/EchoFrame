<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EchoFrame</title>
  <link rel="stylesheet" href="/static/styles.css?v=9">
</head>
<body>
  <main class="shell">
    <section class="workspace">
      <aside class="panel side">
        <div class="brand">
          <div class="mark">EF</div>
          <div>
            <h1>EchoFrame</h1>
            <p id="runState"></p>
          </div>
        </div>

        <section class="servicePanel">
          <div class="panelHeader">
            <h2 data-i18n="services">Services</h2>
            <button id="refreshServices" type="button" data-i18n="refresh">Refresh</button>
          </div>
          <div id="services" class="services"></div>
        </section>

        <section class="gpuPanel" id="gpuPanel">
          <div class="panelHeader">
            <h2 data-i18n="gpu">GPU</h2>
            <span id="gpuBadge" class="statusBadge bad">OFF</span>
          </div>
          <div class="gpuName" id="gpuName" data-i18n="gpuWaiting">Waiting for GPU status</div>
          <div class="meterBlock">
            <div class="meterLabel">
              <span data-i18n="utilization">Utilization</span>
              <strong id="gpuUtilText">--%</strong>
            </div>
            <div class="meter"><span id="gpuUtilBar"></span></div>
          </div>
          <div class="meterBlock">
            <div class="meterLabel">
              <span>VRAM</span>
              <strong id="gpuMemText">-- / --</strong>
            </div>
            <div class="meter"><span id="gpuMemBar"></span></div>
          </div>
          <div class="gpuMeta">
            <span id="gpuTemp">-- C</span>
            <span id="gpuProcessCount"></span>
          </div>
          <div id="gpuProcesses" class="gpuProcesses"></div>
        </section>

        <label class="field">
          <span data-i18n="avatar">Avatar</span>
          <input id="avatarInput" type="file" accept="image/png,image/jpeg,image/webp">
        </label>

        <div class="avatarPreview">
          <img id="avatarPreview" alt="">
        </div>
      </aside>

      <section class="panel main">
        <div class="toolbar">
          <div class="workflowStack">
            <div class="workflowGroup" role="group" aria-label="Workflow" data-i18n-aria="workflow">
              <button class="workflow active" data-backend="ltx_ia2v" type="button" data-i18n="workflowLtx">LTX IA2V</button>
              <button class="workflow" data-backend="musetalk" type="button" data-i18n="workflowWanMuseTalk">Wan + MuseTalk</button>
            </div>
            <div class="modeGroup" id="wanModeGroup" role="group" aria-label="Mode" data-i18n-aria="mode" hidden>
              <button class="mode active" data-mode="fast" type="button" data-i18n="modeFast">Still + MuseTalk</button>
              <button class="mode" data-mode="wan_loop" type="button" data-i18n="modeWanLoop">Wan Loop</button>
              <button class="mode" data-mode="wan" type="button" data-i18n="modeWanFull">Wan Full</button>
            </div>
          </div>
          <div class="toolbarActions">
            <div class="langGroup" role="group" aria-label="Language" data-i18n-aria="language">
              <button class="lang" data-lang="zh" type="button">中文</button>
              <button class="lang" data-lang="en" type="button">EN</button>
            </div>
            <button id="refreshAllStatus" type="button" data-i18n="refresh">Refresh</button>
          </div>
        </div>

        <div class="settingsRow">
          <label class="field resolutionField">
            <span><span data-i18n="resolution">Resolution</span> <output id="resolutionValue">320</output></span>
            <input id="resolutionRange" type="range" min="120" max="512" step="8" value="320">
          </label>
          <label class="field resolutionNumber">
            <span data-i18n="size">Size</span>
            <input id="resolutionNumber" type="number" min="120" max="512" step="8" value="320">
          </label>
        </div>

        <label class="field">
          <span data-i18n="message">Message</span>
          <textarea id="message" rows="4" placeholder="Ask the avatar..." data-i18n-placeholder="messagePlaceholder"></textarea>
        </label>

        <label class="field grow">
          <span data-i18n="spokenText">口播文本</span>
          <textarea id="replyOverride" rows="4" placeholder="输入要直接生成的口播文本..." data-i18n-placeholder="spokenTextPlaceholder"></textarea>
        </label>

        <div class="row">
          <label class="field">
            <span data-i18n="voice">Voice</span>
            <select id="voiceChoice">
              <option value="female" selected data-i18n="voiceFemale">Female</option>
              <option value="male" data-i18n="voiceMale">Male</option>
            </select>
          </label>
          <div class="actions">
            <button id="send" class="primary" type="button" data-i18n="generate">Generate</button>
            <button id="stop" class="danger" type="button" disabled data-i18n="stop">Stop</button>
          </div>
        </div>

        <section class="stagePanel">
          <h2 data-i18n="runStatus">Run Status</h2>
          <div id="stageStatus" class="stageStatus"></div>
          <div id="runError" class="runError" hidden></div>
        </section>

        <div class="resultGrid">
          <section class="output">
            <h2 data-i18n="reply">Reply</h2>
            <p id="reply"></p>
            <div class="regenActions">
              <button id="regenLlm" type="button" data-stage="llm" data-i18n="regenLlm" disabled>Regenerate Text</button>
              <button id="regenTts" type="button" data-stage="tts" data-i18n="regenTts" disabled>Regenerate Voice</button>
              <button id="regenVideo" type="button" data-stage="video" data-i18n="regenVideo" disabled>Regenerate Video</button>
            </div>
            <dl>
              <dt>CosyVoice</dt>
              <dd id="instruct"></dd>
              <dt data-i18n="ttsSent">TTS Sent</dt>
              <dd id="ttsSent"></dd>
              <dt data-i18n="workflow">Workflow</dt>
              <dd id="resultWorkflow"></dd>
              <dt data-i18n="videoPrompt">Video Prompt</dt>
              <dd id="wanPrompt"></dd>
              <dt data-i18n="audio">Audio</dt>
              <dd id="duration"></dd>
              <dt data-i18n="resolution">Resolution</dt>
              <dd id="resultResolution"></dd>
              <dt data-i18n="timings">Timings</dt>
              <dd id="timings"></dd>
            </dl>
          </section>
          <section class="output media">
            <h2 data-i18n="video">Video</h2>
            <video id="video" controls playsinline></video>
          </section>
        </div>
      </section>
    </section>
  </main>
  <script src="/static/app.js?v=28"></script>
</body>
</html>
